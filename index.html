
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TicTacToe Educativo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#030b08;--panel:#071a13;--text:#edfff2;--muted:#a5cbb1;
  --neon:#39ff14;--green:#00ff91;--line:#17683c;
  --x:#ff303f;--o:#168bff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:'Oxanium','Trebuchet MS',sans-serif;
  background:radial-gradient(ellipse at center,#0b2b1a,var(--bg) 76%);
  color:var(--text);display:flex;align-items:center;justify-content:center;padding:10px
}
button{
  font:inherit;font-weight:600;color:var(--text);background:#06170f;
  border:2px solid var(--neon);border-radius:11px;padding:10px 15px;
  cursor:pointer;box-shadow:0 0 8px #39ff1460;transition:transform .18s,background .18s,box-shadow .18s
}
button:hover{background:#123b24;box-shadow:0 0 16px #39ff14;transform:translateY(-2px)}
button:active{transform:scale(.97)}
button:disabled{opacity:.7;cursor:default;transform:none}
.app{
  position:relative;width:min(760px,100%);height:min(94dvh,800px);
  min-height:0;overflow:auto;scrollbar-width:none;border:2px solid var(--neon);
  border-radius:19px;background:#03110bf2;padding:clamp(12px,2.5vh,22px);
  box-shadow:0 0 14px #39ff1480,0 0 35px #00ff8840;
  display:flex;flex-direction:column;justify-content:center
}
.app::-webkit-scrollbar{display:none}
.hidden{display:none!important}
h1{text-align:center;color:var(--neon);font-size:clamp(27px,5vh,43px);margin:5px 0;text-shadow:0 0 13px #39ff14;letter-spacing:2px}
h2{text-align:center;color:var(--green);font-size:clamp(19px,3vh,26px);margin:8px 0 14px}
h3{text-align:center;font-size:16px;margin:15px 0 8px}
p{color:var(--muted);line-height:1.5;font-size:14px}
.center{text-align:center}
.subtitle{color:var(--green);letter-spacing:3px;text-align:center;font-size:11px}
.logo{width:clamp(125px,22vh,180px);height:clamp(105px,18.5vh,150px);display:block;margin:0 auto 5px;filter:drop-shadow(0 0 10px #39ff1488);animation:float 3s ease-in-out infinite}
#home h1{font-size:clamp(36px,6.5vh,55px);letter-spacing:2.5px}
#home .subtitle{font-size:14px;letter-spacing:4px;font-weight:800}
#questionDifficulty{display:inline-flex;align-items:center;justify-content:center;padding:6px 13px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;background:linear-gradient(135deg,#174329,#168b38);color:#fff;border:1px solid #39ff14;box-shadow:0 0 12px #39ff1460}
body.light #questionDifficulty{background:linear-gradient(135deg,#d9fbe2,#b5f2c4);color:#14532d;border-color:#168b38;box-shadow:0 0 8px #168b3830}
#home{flex:1;min-height:0;display:flex;flex-direction:column}
.home-content{margin:auto 0}
#home .footer{margin-top:auto;padding-top:8px;flex-shrink:0}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px #39ff14)}50%{filter:drop-shadow(0 0 12px #39ff14)}}
@keyframes sparkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.13) rotate(-5deg)}}
.menu{display:grid;gap:10px;width:min(330px,100%);margin:17px auto}
.menu button{font-size:clamp(14px,2.2vh,17px);padding:clamp(9px,1.7vh,14px)}
.menu button:first-child{animation:pulse 3s infinite}
.pink{border-color:var(--green);box-shadow:0 0 9px #00ff8855}
.green{border-color:var(--neon)}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:clamp(12px,2vh,18px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.small{font-size:12px;padding:7px 10px}
.row{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap}
.row button{min-width:90px}
.flag{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:800}
.flag svg{width:25px;height:17px;display:block;flex-shrink:0}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;width:min(330px,75vw,38vh);margin:12px auto}
.cell{
  aspect-ratio:1;font-family:'Oxanium',sans-serif;font-size:clamp(38px,8vh,60px);
  font-weight:800;padding:0;border:2px solid #197b45;background:#04170e;
  box-shadow:inset 0 0 12px #39ff1410
}
.cell.x{color:var(--x)!important;text-shadow:0 0 12px #ff303f99!important}
.cell.o{color:var(--o)!important;text-shadow:0 0 12px #168bff99!important}
.cell.correct{background:#164c28!important;border-color:var(--neon)!important;box-shadow:0 0 22px var(--neon)!important}
.score{display:flex;justify-content:center;gap:25px;font-size:17px;margin:8px}
.scoreX{color:var(--x)}.scoreO{color:var(--o)}
.turn-badge{color:var(--green);font-weight:700;text-shadow:0 0 8px #39ff1466}
.footer{text-align:center;font-size:10px;color:#679578;margin-top:8px;letter-spacing:.5px}
.question{font-size:clamp(16px,2.7vh,21px);color:var(--text);text-align:center;margin:12px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.answers button{font-size:14px;min-height:45px;padding:8px}
.answers button.right{background:#174b28;border-color:var(--neon)}
.answers button.wrong{background:#401b2b;border-color:#ff5470}
.feedback{text-align:center;min-height:22px;margin-top:8px;font-size:14px;color:var(--green)}
/* Ventanas flotantes centradas */
.overlay{
  position:fixed;inset:0;z-index:20;background:#000a;backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;padding:15px
}
.modal{
  width:min(510px,100%);max-height:85dvh;overflow:auto;scrollbar-width:thin;
  background:#06170ff7;border:2px solid var(--neon);border-radius:17px;
  padding:clamp(14px,2.5vh,22px);box-shadow:0 0 22px #39ff1477,0 0 50px #0008;
  animation:pop .2s ease-out
}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal .topbar{margin-bottom:8px}
.modal .topbar h2{margin:4px 0}
.close-arrow{font-size:19px;min-width:42px;padding:5px 10px}
.modal p{font-size:14px}
.modal .answers button{min-height:48px}
.modal .question{margin:15px 0}
.modal .row{margin-top:12px}
body.light{
  --bg:#edf8ef;--panel:#fff;--text:#182c20;--muted:#405b49;--line:#9bcaa9;
  background:radial-gradient(ellipse at center,#d6f2dc,#f1fff3 75%)
}
body.light .app{background:#f8fffaf5;border-color:#168b38;box-shadow:0 0 14px #2dbb4a55}
body.light h1{color:#168b38;text-shadow:0 0 8px #39ff1466}
body.light button{background:#f3fff5;color:#173a22;border-color:#168b38;box-shadow:0 0 7px #168b3825}
body.light button:hover{background:#dff8e4;box-shadow:0 0 13px #168b3866}
body.light .cell{background:#f4fff6;border-color:#8bc79a}
body.light .cell.x{color:#d71932!important;text-shadow:0 0 5px #d7193244!important}
body.light .cell.o{color:#075fc7!important;text-shadow:0 0 5px #075fc744!important}
body.light .turn-badge{color:#147b32}
body.light .modal{background:#f8fffdf7;border-color:#168b38}
body.light .modal .question{color:#182c20}
body.light .modal button{background:#f3fff5;color:#173a22}
body.light .answers button.right{background:#d8ffe2;border-color:#168b38}
body.light .answers button.wrong{background:#ffe2e7;border-color:#d71932}
body.light .footer{color:#557c61}
@media(max-height:650px){
 .app{height:98dvh;padding:8px}
 .logo{width:88px;height:74px}
 h1{font-size:28px}
 #home h1{font-size:clamp(32px,5.8vh,44px)}
 .menu{gap:6px;margin:8px auto}
 .menu button{padding:7px}
 .board{width:min(245px,34vh);gap:5px;margin:7px auto}
 .cell{font-size:38px}
 .panel{padding:9px}
 .question{margin:7px 0}
 .answers button{min-height:35px;padding:5px}
}
@media(max-width:420px){
 .answers{grid-template-columns:1fr;gap:6px}
 .modal .answers button{min-height:37px}
 .board{width:min(260px,60vw,34vh)}
 .footer{font-size:9px}
}
</style>
</head>

function answerText(value){return lang==='en'?(answerTranslations[value]||value):value;}

function translate(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-es]').forEach(e=>e.textContent=e.getAttribute('data-'+lang));
 const names={facil:['Fácil','Easy'],medio:['Medio','Medium'],dificil:['Difícil','Hard']};
 document.getElementById('levelLabel').textContent=(lang==='es'?'Dificultad: ':'Difficulty: ')+names[difficulty][lang==='es'?0:1];
 document.getElementById('turnLabel').textContent=lang==='es'?'Turno de '+player:"Player "+player+"'s turn";
 const es=document.getElementById('esBtn'),en=document.getElementById('enBtn');
 if(es)es.style.background=lang==='es'?'#174329':'';
 if(en)en.style.background=lang==='en'?'#174329':'';
 if(currentQuestion)renderQuestionText();
}
function setLanguage(l){lang=l;translate()}
function setTheme(t){document.body.classList.toggle('light',t==='light')}
function closeOverlay(id){document.getElementById(id).classList.add('hidden')}
function outsideClose(e,id){if(e.target.id===id)closeOverlay(id)}
function closeAllOverlays(){['settingsOverlay','questionOverlay','resultOverlay','infoOverlay','difficultyOverlay'].forEach(closeOverlay)}
function openPanel(id){
 const titles={
 settings:['⚙️ Configuraciones','⚙️ Settings'],
 rules:['📜 Reglas','📜 Rules'],
 instructions:['💡 Instrucciones','💡 Instructions']
 };
 const content={
 rules:[
 'Dos jugadores se turnan: X y O. Para marcar una casilla, hay que responder una pregunta. Si aciertas, colocas tu símbolo; si fallas, pierdes el turno. Gana quien consiga tres símbolos en línea. Si se llena el tablero sin ganador, hay empate.',
 'Two players take turns: X and O. Answer a question to mark a square. If correct, place your symbol; if wrong, you lose your turn. Get three symbols in a line to win. If the board fills with no winner, it is a draw.'
 ],
 instructions:[
 'Pulsa Jugar, elige una dificultad y selecciona una casilla vacía. Contesta la pregunta para intentar colocar tu símbolo. ¡Compite con el otro jugador!',
 'Press Play, choose a difficulty and select an empty square. Answer the question to try to place your symbol. Compete against the other player!'
 ]
 };
 if(id==='settings'){document.getElementById('settingsOverlay').classList.remove('hidden');return}
 document.getElementById('infoTitle').textContent=titles[id][lang==='es'?0:1];
 document.getElementById('infoText').textContent=content[id][lang==='es'?0:1];
 document.getElementById('infoOverlay').classList.remove('hidden');
}
function showDifficulty(){document.getElementById('difficultyOverlay').classList.remove('hidden')}
function resetScores(){scores={X:0,O:0};updateScores()}
function backHome(){
 clearTimeout(answerTimer);closeAllOverlays();locked=false;pendingCell=null;currentQuestion=null;
 document.getElementById('game').classList.add('hidden');
 document.getElementById('home').classList.remove('hidden');
 board=Array(9).fill('');player='X';gameOver=false;used.clear();resetScores();renderBoard();
}
function openGameSettings(){document.getElementById('settingsOverlay').classList.remove('hidden')}
function startGame(d){
 clearTimeout(answerTimer);difficulty=d;board=Array(9).fill('');player='X';gameOver=false;locked=false;pendingCell=null;used.clear();currentQuestion=null;resetScores();
 closeAllOverlays();document.getElementById('home').classList.add('hidden');document.getElementById('game').classList.remove('hidden');renderBoard();translate();
}
function newRound(){startGame(difficulty)}
function renderBoard(){
 const el=document.getElementById('board');el.innerHTML='';
 board.forEach((v,i)=>{
  const b=document.createElement('button');b.className='cell'+(v==='X'?' x':v==='O'?' o':'');
  b.textContent=v;b.disabled=!!v||gameOver||locked;b.onclick=()=>chooseCell(i);el.appendChild(b)
 });
 document.getElementById('turnLabel').textContent=lang==='es'?'Turno de '+player:"Player "+player+"'s turn";
}
function chooseCell(i){if(board[i]||gameOver||locked)return;pendingCell=i;locked=true;renderBoard();askQuestion()}
function getQuestion(){
 const chance={facil:.20,medio:.50,dificil:.90}[difficulty];
 const wantsHard=Math.random()<chance;
 const target=wantsHard?3:(difficulty==='facil'?1:2);
 let available=Q.map((q,i)=>({q,i})).filter(o=>o.q[0]===target&&!used.has(o.i));
 if(!available.length)available=Q.map((q,i)=>({q,i})).filter(o=>!used.has(o.i));
 if(!available.length){used.clear();available=Q.map((q,i)=>({q,i})).filter(o=>o.q[0]===target)}
 const picked=available[Math.floor(Math.random()*available.length)];used.add(picked.i);return picked.q;
}
function askQuestion(){
 currentQuestion=getQuestion();document.getElementById('questionOverlay').classList.remove('hidden');document.getElementById('feedback').textContent='';renderQuestionText();
 const opts=[currentQuestion[3],currentQuestion[4],currentQuestion[5],currentQuestion[6]].map((text,i)=>({text:answerText(text),i})).sort(()=>Math.random()-.5);
 const el=document.getElementById('answerButtons');el.innerHTML='';
 opts.forEach(o=>{const b=document.createElement('button');b.textContent=o.text;b.onclick=()=>answerQuestion(o.i===currentQuestion[7],b);el.appendChild(b)});
}
function renderQuestionText(){
 document.getElementById('questionText').textContent=currentQuestion[lang==='es'?1:2];
 document.getElementById('questionDifficulty').textContent=({1:lang==='es'?'Fácil':'Easy',2:lang==='es'?'Medio':'Medium',3:lang==='es'?'Difícil':'Hard'})[currentQuestion[0]];
}
function answerQuestion(correct,chosen){
 if(!locked)return;locked=false;
 [...document.getElementById('answerButtons').children].forEach(b=>b.disabled=true);
 if(correct){
  chosen.classList.add('right');document.getElementById('feedback').textContent=lang==='es'?'✨ ¡Correcto!':'✨ Correct!';
  board[pendingCell]=player;renderBoard();
  document.querySelectorAll('.cell')[pendingCell].classList.add('correct');
 }else{
  chosen.classList.add('wrong');document.getElementById('feedback').textContent=lang==='es'?'❌ Incorrecto. Pierdes el turno.':'❌ Incorrect. You lose your turn.';
 }
 /* La pregunta permanece visible durante 3 segundos después de responder */
 answerTimer=setTimeout(()=>{
  closeOverlay('questionOverlay');
  if(correct&&checkWin(player)){gameOver=true;scores[player]++;updateScores();showResult(player)}
  else if(board.every(Boolean)){gameOver=true;showResult('draw')}
  else player=player==='X'?'O':'X';
  pendingCell=null;currentQuestion=null;renderBoard();translate();
 },3000);
}
function checkWin(p){
 return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(line=>line.every(i=>board[i]===p))
}
function updateScores(){document.getElementById('scoreX').textContent=scores.X;document.getElementById('scoreO').textContent=scores.O}
function showResult(w){
 document.getElementById('resultTitle').textContent=w==='draw'?(lang==='es'?'🤝 ¡Empate!':'🤝 It’s a draw!'):(lang==='es'?'🏆 ¡Gana '+w+'!':'🏆 Player '+w+' wins!');
 document.getElementById('resultText').textContent=lang==='es'?`Puntuación: X ${scores.X} — O ${scores.O}`:`Score: X ${scores.X} — O ${scores.O}`;
 document.getElementById('resultOverlay').classList.remove('hidden');
}
translate();
</script>
